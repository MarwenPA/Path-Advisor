name: ci-ai-service

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  # No `paths:` filter here, deliberately. These jobs are REQUIRED status
  # checks on `main`: a filtered workflow simply never runs on a PR that
  # touches other directories, so the required check stays "Expected"
  # forever and the PR becomes unmergeable without an admin bypass.
  # Verified the hard way — PR #97 (apps/api only) and #98 (apps/web only)
  # each stalled on the check the other one triggered. The repo is public,
  # so Actions minutes are free; the only cost is wall-clock on unrelated PRs.
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q
