{% extends "notifications/email/base.html" %}
{% block content %}
  <p style="margin:0 0 12px;">Bonjour,</p>
  <p style="margin:0 0 16px;">{{ intro }}</p>
  <p style="margin:0 0 8px;font-weight:bold;">Ce que tu peux préparer d'ici là :</p>
  <ul style="margin:0 0 16px;padding-left:20px;">
    {% for item in checklist %}<li style="margin:0 0 6px;">{{ item }}</li>{% endfor %}
  </ul>
  <p style="margin:16px 0 0;">
    <a href="{{ cta_url }}"
       style="display:inline-block;background:#C8312D;color:#FFFFFF;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:bold;">
      {{ cta_label }}
    </a>
  </p>
{% endblock %}
