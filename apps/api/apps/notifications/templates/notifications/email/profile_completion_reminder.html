{% extends "notifications/email/base.html" %}
{% block content %}
  <p style="margin:0 0 12px;">Bonjour {{ first_name }},</p>
  <p style="margin:0 0 12px;">
    Ton profil Path-Advisor est complété à <strong>{{ completion_percent }}&nbsp;%</strong>.
    Complète-le pour recevoir des recommandations plus précises.
  </p>
  <p style="margin:16px 0 0;">
    <a href="{{ profile_url }}"
       style="display:inline-block;background:#C8312D;color:#FFFFFF;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:bold;">
      Compléter mon profil
    </a>
  </p>
{% endblock %}
